name: CI/CD (EAS Update)

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'App.tsx'
      - 'index.tsx'
      - '!android/**'
      - '!ios/**'
      - '!**/*.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Lint, Typecheck and Test
    runs-on: ubuntu-latest
    steps:
      - name: 📦 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 🟢 Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: 'yarn'

      - name: 📥 의존성 패키지 설치
        run: yarn install --frozen-lockfile

      - name: 🔍 타입 체크
        run: yarn typecheck

      - name: ✨ 린트 체크
        run: yarn lint

      - name: 🧪 단위 테스트 실행
        run: yarn test

  update:
    name: EAS Update
    needs: test # 👈 테스트가 성공해야만 실행됨
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # 푸시 이벤트일 때만 배포
    runs-on: ubuntu-latest
    steps:
      - name: 📦 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 🟢 Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: 'yarn'

      - name: 🏗️ EAS CLI 설정
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📥 의존성 패키지 설치
        run: yarn install --frozen-lockfile

      - name: 🚀 EAS Update 발행 (CodePush)
        run: eas update --branch main --non-interactive --message "Deploy from GitHub Actions (${{ github.sha }})"
