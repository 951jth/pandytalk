name: CI/CD (EAS Update)

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'App.tsx'
      - 'index.tsx'
      - '!android/**'
      - '!ios/**'
      - '!**/*.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: yarn lint
          - name: Typecheck
            command: yarn typecheck
          - name: Unit Tests
            command: yarn test
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: yarn

      - name: 의존성 패키지 설치
        run: yarn install --frozen-lockfile

      - name: ${{ matrix.name }} 실행
        run: ${{ matrix.command }}

  test:
    # 브랜치 보호에서 이 이름을 필수 검사로 지정합니다.
    name: Lint, Typecheck and Test
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 모든 CI 검사 결과 확인
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          echo "CI 검사 결과: $CHECKS_RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CHECKS_RESULT" != "success" ]; then
            echo "::error::린트·타입 체크·테스트가 모두 성공해야 머지 및 배포할 수 있습니다."
            exit 1
          fi

  update:
    name: EAS Update
    needs: test # 👈 테스트가 성공해야만 실행됨
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # 푸시 이벤트일 때만 배포
    runs-on: ubuntu-latest
    steps:
      - name: 📦 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 🟢 Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: 'yarn'

      - name: 🏗️ EAS CLI 설정
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📥 의존성 패키지 설치
        run: yarn install --frozen-lockfile

      - name: 🚀 EAS Update 발행 (CodePush)
        run: eas update --branch main --non-interactive --message "Deploy from GitHub Actions (${{ github.sha }})"
